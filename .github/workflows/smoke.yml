name: فحص تشغيل نسخة الويب

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["بناء التطبيق (أندرويد + رابط ويب)"]
    types: [completed]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: sleep 40 && python tool/smoke.py
