name: بناء التطبيق (أندرويد + رابط ويب)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # يولّد ملفات أندرويد والويب إذا مو موجودة (ما يمس مجلد lib)
      - name: تجهيز ملفات أندرويد والويب
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.depo --project-name depo .
          fi
          if [ ! -d web ]; then
            flutter create --platforms=web --org com.depo --project-name depo .
          fi
          # مفتاح التوقيع الرسمي: مشفّر بالمستودع، ويفتحه السر DEPO_KEY_PASS (إذا مو مضاف، يبني بتوقيع تجريبي)
          if [ -n "$DEPO_KEY_PASS" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in branding/upload.jks.enc -out android/app/upload.jks -pass env:DEPO_KEY_PASS
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload.jks\n' "$DEPO_KEY_PASS" "$DEPO_KEY_PASS" > android/key.properties
          fi
          python3 branding/apply_branding.py
        env:
          DEPO_KEY_PASS: ${{ secrets.DEPO_KEY_PASS }}

      - run: flutter pub get

      - name: فحص الكود
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: بناء APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      # نسخة متجر Google Play (.aab) — بس إذا التوقيع الرسمي مفعّل
      - name: بناء نسخة المتجر AAB
        if: ${{ hashFiles('android/key.properties') != '' }}
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: رفع الـ APK
        uses: actions/upload-artifact@v4
        with:
          name: depo-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: بناء نسخة الويب
        run: |
          flutter build web --release --base-href /depo-app/
          cp branding/privacy.html build/web/privacy.html
          cp branding/delete-account.html build/web/delete-account.html

      - name: تجهيز رابط الويب
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: نشر نسخة للتحميل من التلفون
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Depo تجريبي ${{ github.run_number }}
          prerelease: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          fail_on_unmatched_files: false

  deploy-web:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: نشر رابط الويب على GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
