name: بناء تطبيق أندرويد (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # يولّد ملفات أندرويد إذا مو موجودة (ما يمس مجلد lib)
      - name: تجهيز ملفات أندرويد
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.depo --project-name depo .
          fi
          sed -i 's/android:label="depo"/android:label="Depo"/' android/app/src/main/AndroidManifest.xml || true

      - run: flutter pub get

      - name: فحص الكود
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: بناء APK
        run: flutter build apk --release

      - name: رفع الـ APK
        uses: actions/upload-artifact@v4
        with:
          name: depo-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: نشر نسخة للتحميل من التلفون
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Depo تجريبي ${{ github.run_number }}
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
