name: depo
description: "Depo — رواجع المطاعم وعروض التجار بأسعار مخفّضة (الموصل)."
publish_to: "none"
version: 0.13.0+13

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  firebase_core: ">=4.0.0 <7.0.0"
  firebase_auth: ">=6.0.0 <9.0.0"
  cloud_firestore: ">=6.0.0 <9.0.0"
  image_picker: ">=1.0.0 <3.0.0"
  crypto: ^3.0.3
  url_launcher: ">=6.2.0 <7.0.0"
  flutter_local_notifications: ">=17.2.0 <20.0.0"
  geolocator: ">=13.0.0 <15.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <8.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/splash/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
