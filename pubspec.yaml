name: depo
description: "Depo — رواجع المطاعم وعروض التجار بأسعار مخفّضة (الموصل)."
publish_to: "none"
version: 0.4.0+4

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  firebase_core: ">=4.0.0 <7.0.0"
  firebase_auth: ">=6.0.0 <9.0.0"
  cloud_firestore: ">=6.0.0 <9.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
