<!DOCTYPE html><html><head><meta charset="utf-8"><title>Depo relay</title></head><body>
<p id="s">...</p>
<script>
// يفتحه Play Console ويطلب ملفات من هذا الموقع، وهذا يرجّعها إله بـ postMessage (ويه نسبة التقدم والأخطاء)
(async () => {
  const target = window.opener || (window.parent !== window ? window.parent : null);
  const send = (m) => target && target.postMessage(m, 'https://play.google.com');
  const q = new URLSearchParams(location.search);
  const files = (q.get('f') || '').split(',').filter(Boolean);
  const out = [];
  try {
    for (const f of files) {
      const r = await fetch(f + '?v=' + Date.now());
      if (!r.ok) throw new Error(f + ' HTTP ' + r.status);
      const total = +r.headers.get('content-length') || 0;
      const reader = r.body.getReader(); const parts = []; let got = 0, last = 0;
      for (;;) { const { done, value } = await reader.read(); if (done) break; parts.push(value); got += value.length;
        if (Date.now() - last > 1500) { last = Date.now(); send({ depoProgress: { file: f, got, total } }); } }
      out.push({ name: f.split('/').pop(), type: r.headers.get('content-type') || 'application/octet-stream', blob: new Blob(parts) });
    }
    document.getElementById('s').textContent = 'sent ' + out.length;
    send({ depoFiles: out });
  } catch (e) { send({ depoError: String(e) }); }
})();
</script></body></html>
